replicaCount: 1
image:
  repository: public.ecr.aws/w0f5g4k6/client-svc
  pullPolicy: IfNotPresent
  tag: ""
service:
  type: ClusterIP
  name: client
  port: 80
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/actuator/prometheus"
ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/group.name: myapp1
    alb.ingress.kubernetes.io/load-balancer-name: "${ENVIRONMENT}-microservices-alb"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/listen-ports: "[{\"HTTP\":80},{\"HTTPS\":443}]"
  hosts:
    - host: client.${ENVIRONMENT}.devops4solutions.com
      paths:
        - path: /
          pathType: Prefix  #  - secretName: chart-example-tls
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http
env:
  HELLO_SERVICE_URL: "http://hello.app1.svc.cluster.local"
  WORLD_SERVICE_URL: "http://world.app1.svc.cluster.local"
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
